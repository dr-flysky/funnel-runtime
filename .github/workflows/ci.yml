name: CI
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The generator is the integration test: it drives the real HTTP API.
      - run: npm run seed && npm run generate:traffic -- 60
      # Publish/rollback must survive a real cycle, not just unit tests.
      - run: npm run publish -- configs/funnel-v2.example.json && npm run rollback
